<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choir Rehearsals characters: three.js</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; color: #ddd; font: 14px ui-monospace, monospace; }
  #ui { position: fixed; top: 8px; left: 8px; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <select id="who"><option value="prym">Prym</option><option value="basso">Basso</option><option value="echo">Echo</option></select>
  <select id="pose"></select>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x202030, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(2, 3, 4);
scene.add(key);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 1, 4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.update();

const loader = new GLTFLoader();
const clock = new THREE.Clock();
let current = null, mixer = null, clips = [];
const whoSel = document.getElementById('who');
const poseSel = document.getElementById('pose');

function play(name) {
  mixer.stopAllAction();
  mixer.clipAction(THREE.AnimationClip.findByName(clips, name)).play();
}

async function load(who) {
  const gltf = await loader.loadAsync(`../glb/choir_${who}.glb`);
  if (current) scene.remove(current);
  current = gltf.scene;
  scene.add(current);
  clips = gltf.animations;
  mixer = new THREE.AnimationMixer(current);
  poseSel.innerHTML = clips.map(c => `<option>${c.name}</option>`).join('');
  poseSel.value = 'pose_rest';
  play('pose_rest');
}

whoSel.onchange = () => load(whoSel.value);
poseSel.onchange = () => play(poseSel.value);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  if (mixer) mixer.update(clock.getDelta());
  renderer.render(scene, camera);
});
load('prym');
</script>
</body>
</html>
